<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="360" height="440">
  <defs>
    <linearGradient id="gcashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066F6" />
      <stop offset="100%" stop-color="#0047C4" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#002b80" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="8" y="8" width="344" height="424" rx="24" fill="#FFFFFF" filter="url(#shadow)" stroke="#EBF1FA" stroke-width="2"/>

  <!-- GCash Header Bar -->
  <rect x="8" y="8" width="344" height="76" rx="24" fill="url(#gcashGrad)" />
  <rect x="8" y="56" width="344" height="28" fill="url(#gcashGrad)" />

  <!-- GCash Logo & Text -->
  <g transform="translate(30, 24)">
    <!-- Stylized G Icon -->
    <circle cx="22" cy="22" r="18" fill="#FFFFFF" />
    <path d="M22 10 A12 12 0 1 0 34 22 L24 22 L24 25 L31.5 25 A9.5 9.5 0 1 1 22 12.5 A9.5 9.5 0 0 1 29 15.5 L31 13.5 A12 12 0 0 0 22 10 Z" fill="#0066F6" />
    <!-- Text -->
    <text x="50" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">GCash</text>
    <rect x="135" y="14" width="76" height="20" rx="10" fill="rgba(255,255,255,0.22)" />
    <text x="173" y="28" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">OFFICIAL</text>
  </g>

  <!-- Merchant Info -->
  <g transform="translate(180, 115)" text-anchor="middle">
    <text font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="700" fill="#1E293B" letter-spacing="0.5">CANDY &amp; ROSE SALON</text>
    <text y="18" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B">Merchant ID: CR-8839201</text>
  </g>

  <!-- QR Frame Container -->
  <rect x="55" y="145" width="250" height="250" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- QR Code Matrix Graphic -->
  <g transform="translate(75, 165)">
    <!-- Top-Left Finder Pattern -->
    <rect x="0" y="0" width="56" height="56" rx="10" fill="#0F172A" />
    <rect x="8" y="8" width="40" height="40" rx="6" fill="#FFFFFF" />
    <rect x="16" y="16" width="24" height="24" rx="4" fill="#0066F6" />

    <!-- Top-Right Finder Pattern -->
    <rect x="154" y="0" width="56" height="56" rx="10" fill="#0F172A" />
    <rect x="162" y="8" width="40" height="40" rx="6" fill="#FFFFFF" />
    <rect x="170" y="16" width="24" height="24" rx="4" fill="#0066F6" />

    <!-- Bottom-Left Finder Pattern -->
    <rect x="0" y="154" width="56" height="56" rx="10" fill="#0F172A" />
    <rect x="8" y="162" width="40" height="40" rx="6" fill="#FFFFFF" />
    <rect x="16" y="170" width="24" height="24" rx="4" fill="#0066F6" />

    <!-- QR Data Elements / Dots Matrix -->
    <!-- Row segments -->
    <rect x="68" y="4" width="8" height="8" rx="2" fill="#0F172A" />
    <rect x="84" y="4" width="16" height="8" rx="2" fill="#0F172A" />
    <rect x="112" y="4" width="8" height="8" rx="2" fill="#0F172A" />
    <rect x="132" y="4" width="12" height="8" rx="2" fill="#0F172A" />

    <rect x="68" y="18" width="16" height="8" rx="2" fill="#0F172A" />
    <rect x="96" y="18" width="24" height="8" rx="2" fill="#0F172A" />
    <rect x="132" y="18" width="8" height="8" rx="2" fill="#0F172A" />

    <rect x="68" y="32" width="8" height="8" rx="2" fill="#0F172A" />
    <rect x="88" y="32" width="12" height="8" rx="2" fill="#0F172A" />
    <rect x="112" y="32" width="28" height="8" rx="2" fill="#0F172A" />

    <rect x="68" y="46" width="24" height="8" rx="2" fill="#0F172A" />
    <rect x="104" y="46" width="16" height="8" rx="2" fill="#0F172A" />
    <rect x="132" y="46" width="12" height="8" rx="2" fill="#0F172A" />

    <!-- Horizontal timing bar -->
    <rect x="8" y="68" width="194" height="8" rx="2" fill="#0F172A" stroke="#FFFFFF" stroke-dasharray="8,8" stroke-width="4" />

    <!-- Middle cluster -->
    <rect x="8" y="84" width="16" height="16" rx="3" fill="#0F172A" />
    <rect x="36" y="84" width="24" height="8" rx="2" fill="#0F172A" />
    <rect x="72" y="84" width="12" height="16" rx="2" fill="#0F172A" />
    <rect x="132" y="84" width="16" height="8" rx="2" fill="#0F172A" />
    <rect x="160" y="84" width="40" height="12" rx="2" fill="#0F172A" />

    <rect x="4" y="108" width="28" height="12" rx="2" fill="#0F172A" />
    <rect x="44" y="104" width="16" height="24" rx="3" fill="#0F172A" />
    <rect x="156" y="104" width="20" height="20" rx="3" fill="#0F172A" />
    <rect x="188" y="108" width="16" height="12" rx="2" fill="#0F172A" />

    <rect x="12" y="136" width="20" height="8" rx="2" fill="#0F172A" />
    <rect x="44" y="136" width="12" height="8" rx="2" fill="#0F172A" />
    <rect x="168" y="132" width="36" height="12" rx="2" fill="#0F172A" />

    <!-- Bottom-right cluster -->
    <rect x="68" y="154" width="20" height="12" rx="2" fill="#0F172A" />
    <rect x="100" y="154" width="16" height="24" rx="3" fill="#0F172A" />
    <rect x="128" y="154" width="28" height="12" rx="2" fill="#0F172A" />
    <rect x="168" y="154" width="16" height="12" rx="2" fill="#0F172A" />
    <rect x="196" y="154" width="12" height="12" rx="2" fill="#0F172A" />

    <rect x="68" y="178" width="12" height="28" rx="2" fill="#0F172A" />
    <rect x="92" y="188" width="24" height="16" rx="3" fill="#0F172A" />
    <rect x="128" y="178" width="16" height="28" rx="2" fill="#0F172A" />
    <rect x="156" y="178" width="24" height="12" rx="2" fill="#0F172A" />
    <rect x="192" y="178" width="16" height="28" rx="2" fill="#0F172A" />

    <!-- Center GCash emblem badge -->
    <rect x="85" y="85" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#0066F6" stroke-width="2" />
    <circle cx="105" cy="105" r="14" fill="#0066F6" />
    <text x="105" y="110" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">G</text>
  </g>

  <!-- Scan to Pay Instruction -->
  <text x="180" y="415" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0066F6" text-anchor="middle" letter-spacing="1">SCAN TO PAY WITH GCASH</text>
</svg>
